<!DOCTYPE html>
<html>
<head>
    <title>Lanisha's Security Playground</title>
    <style>
        body {
            background-color: #111;
            color: white;
 
            text-align: center;
        }

        /* Buttons styling */
        button {
            padding: 15px;
            font-size: 18px;
            margin: 10px;
            background-color: #ffb6c1; /* pink background */
            color: white; /* white text */
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #ff99c8; /* slightly darker pink on hover */
	color: white; /* keep text white */
        }

        /* Console area styling */
        #logArea {
            background-color: #000;
            color: #ff69b4; /* hot pink text */
            padding: 10px;
            height: 200px;
            width: 80%;
            margin: 20px auto;
            overflow-y: scroll;
            font-family: monospace;
            box-shadow: 0 0 20px #ff69b4, 0 0 40px #ff69b4; /* glowing effect */
            border-radius: 5px;
        }

        /* Sparkle container */
        #sparkContainer {verf{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        /* Sparkle styling */
        .spark {
            position: absolute;
            font-size: 16px;
            animation: floatUp 1s linear forwards;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

<h1>Security Testing Playground</h1>
<p>This site is used for testing web requests, security experiments and professional development. Made by Lanisha Thomas.</p>

<!-- Buttons -->
<button onclick="triggerEffect('admin')">Admin</button>
<button onclick="triggerEffect('login')">Login</button>
<button onclick="triggerEffect('config')">Config</button>

<!-- Console area -->
<pre id="logArea"></pre>

<!-- Sparkle container -->
<div id="sparkContainer"></div>

<script>
function triggerEffect(target) {
    const logs = {
        admin: [
            "Accessing /admin page...",
            "Checking admin privileges...",
            "No admin vulnerabilities found.",
            "Admin scan complete."
        ],
        login: [
            "Accessing /login page...",
            "Trying common passwords...",
            "No login vulnerabilities found.",
            "Login scan complete."
        ],
        config: [
            "Accessing /config page...",
            "Reading configuration files...",
            "No config vulnerabilities found.",
            "Config scan complete."
        ]
    };

    const logArea = document.getElementById("logArea");
    logArea.innerHTML = ""; // clear previous messages

    const sparkleColors = ["#ff69b4", "#ff1493", "#ffb6c1", "#ffc0cb", "#ff8da0"]; // hot pink tones

    let i = 0;
    const messages = logs[target] || ["Unknown target"];

    const interval = setInterval(() => {
        // add random sparkle to console message
        let sparkleSymbol = Math.random() < 0.3 ? " ✨" : "";
        logArea.innerHTML += messages[i] + sparkleSymbol + "\n";
        logArea.scrollTop = logArea.scrollHeight;

        // create a floating sparkle animation
        const sparkle = document.createElement("div");
        sparkle.className = "spark";
        sparkle.innerText = "✨";
        sparkle.style.left = Math.random() * window.innerWidth + "px";
        sparkle.style.top = Math.random() * window.innerHeight + "px";
        sparkle.style.color = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
        document.getElementById("sparkContainer").appendChild(sparkle);

        // remove sparkle after animation
        setTimeout(() => sparkle.remove(), 1000);

        i++;
        if (i >= messages.length) clearInterval(interval);
    }, 500);
}
</script>

</body>
</html>
